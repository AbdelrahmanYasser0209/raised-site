<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAISED. — AIESEC Egypt B2B Commission Ranking</title>
    <script type="module" crossorigin src="./index-BKXO_6Xu.js"></script>
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0E1013;
        transition: opacity .45s ease, visibility .45s ease;
      }
      #boot-loader.boot-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #boot-loader .boot-spinner {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,0.12);
        border-top-color: #037EF3;
        animation: boot-spin .8s linear infinite;
      }
      #boot-loader .boot-label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: #9AA0A6;
      }
      #boot-loader .boot-label b {
        color: #fff;
        font-weight: 700;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <style>
      #debug-toggle {
        position: fixed;
        bottom: 14px;
        right: 14px;
        z-index: 100000;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: none;
        background: rgba(14,16,19,0.85);
        color: #9AA0A6;
        font-size: 18px;
        line-height: 40px;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      }
      #debug-toggle.has-errors {
        color: #fff;
        background: #F85A40;
      }
      #debug-panel {
        position: fixed;
        left: 0; right: 0; bottom: 0;
        max-height: 45vh;
        overflow-y: auto;
        z-index: 100000;
        background: rgba(11,13,16,0.97);
        color: #DDE1E5;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        line-height: 1.5;
        padding: 10px 12px 50px;
        display: none;
        white-space: pre-wrap;
        word-break: break-all;
        border-top: 1px solid #222;
      }
      #debug-panel.open { display: block; }
      #debug-panel .dbg-line { border-bottom: 1px solid #1b1d21; padding: 3px 0; }
    </style>
  </head>
  <body style="margin:0;">
    <div id="root"></div>
    <div id="boot-loader">
      <div class="boot-spinner"></div>
      <div class="boot-label"><b>RAISED.</b> — loading live data…</div>
    </div>
    <button id="debug-toggle" type="button">🐞</button>
    <div id="debug-panel"></div>
    <script>
      (function () {
        var panel = document.getElementById('debug-panel');
        var toggle = document.getElementById('debug-toggle');
        var lines = [];

        function pad(n) { return n < 10 ? '0' + n : n; }
        function ts() {
          var d = new Date();
          return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + '.' + (d.getMilliseconds() + '').padStart(3, '0');
        }
        function log(msg) {
          var line = ts() + '  ' + msg;
          lines.push(line);
          var div = document.createElement('div');
          div.className = 'dbg-line';
          div.textContent = line;
          panel.appendChild(div);
          panel.scrollTop = panel.scrollHeight;
        }
        function flagError() {
          toggle.classList.add('has-errors');
        }

        toggle.addEventListener('click', function () {
          panel.classList.toggle('open');
        });

        log('UA: ' + navigator.userAgent);
        log('online: ' + navigator.onLine + ', connection: ' + (navigator.connection && navigator.connection.effectiveType || 'n/a'));
        log('page URL: ' + location.href);

        window.addEventListener('error', function (e) {
          if (e.target && e.target.tagName === 'SCRIPT') {
            log('RESOURCE ERROR (script failed to load): ' + e.target.src);
            flagError();
          }
        }, true);

        window.onerror = function (msg, src, line, col, err) {
          log('JS ERROR: ' + msg + ' @ ' + src + ':' + line + ':' + col + (err && err.stack ? '\n' + err.stack : ''));
          flagError();
        };

        window.addEventListener('unhandledrejection', function (e) {
          log('UNHANDLED PROMISE REJECTION: ' + (e.reason && (e.reason.message || e.reason) || e.reason));
          flagError();
        });

        var origCreateElement = document.createElement.bind(document);
        document.createElement = function (tag) {
          var el = origCreateElement(tag);
          if (String(tag).toLowerCase() === 'script') {
            var start = Date.now();
            var srcLogged = false;
            var origSetAttr = el.setAttribute.bind(el);
            Object.defineProperty(el, 'src', {
              configurable: true,
              get: function () { return el.getAttribute('src'); },
              set: function (v) {
                origSetAttr('src', v);
                if (v && v.indexOf('script.google.com') !== -1) {
                  log('SCRIPT INJECTED (JSONP request): ' + v);
                  srcLogged = true;
                }
              }
            });
            el.addEventListener('load', function () {
              if (srcLogged) log('SCRIPT LOAD event fired OK (' + (Date.now() - start) + 'ms) — but check if the JSONP callback actually ran');
            });
            el.addEventListener('error', function () {
              if (srcLogged) {
                log('SCRIPT ERROR event fired (' + (Date.now() - start) + 'ms): failed to load ' + el.src);
                flagError();
              }
            });
          }
          return el;
        };
      })();
    </script>
    <script>
      (function () {
        var loader = document.getElementById('boot-loader');
        var done = false;

        function hideLoader() {
          if (done || !loader) return;
          done = true;
          loader.classList.add('boot-hidden');
          setTimeout(function () {
            if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
          }, 500);
          observer.disconnect();
        }

        // The app renders a status badge with one of these labels once it
        // has resolved its data source (live / demo / or a fetch error).
        // Watching for any of them is how we know the app is no longer
        // in its initial "Syncing…" state.
        var resolvedMarkers = ['Live data', 'Demo data', 'Backend unreachable'];

        function checkResolved() {
          var text = document.body.innerText || '';
          for (var i = 0; i < resolvedMarkers.length; i++) {
            if (text.indexOf(resolvedMarkers[i]) !== -1) {
              hideLoader();
              return;
            }
          }
        }

        var observer = new MutationObserver(checkResolved);
        observer.observe(document.body, { childList: true, subtree: true, characterData: true });

        // Safety net: never block the UI forever if something unexpected
        // happens (e.g. markers change in a future build).
        setTimeout(hideLoader, 12000);
      })();
    </script>
  </body>
</html>
